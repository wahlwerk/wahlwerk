[project]
name = "wahlwerk"
version = "0.1.0"
description = "Electoral and parliamentary systems as rules-as-code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.5",
    "tomli>=2 ; python_full_version < '3.11'",
    "numpy>=1.26",
]

[project.optional-dependencies]
ui = ["wahlwerk-ui"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wahlwerk"]

[dependency-groups]
docs = [
    "autodoc-pydantic>=2.2",
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx>=8.1",
    "sphinxcontrib-bibtex>=2.6",
]
dev = [
    "jsonschema>=4.23",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "wahlwerk-ui",
]

[tool.uv.sources]
wahlwerk-ui = { path = "../wahlwerk-ui", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests", "src/wahlwerk/calc"]
addopts = "--doctest-modules"

[tool.ruff.lint.isort]
known-first-party = ["wahlwerk"]
known-local-folder = ["reference"]

[tool.mypy]
# pydantic validates constructor arguments at runtime (ids against their patterns),
# so mypy takes them as pydantic does: a literal "land" is a valid LevelName.
plugins = ["pydantic.mypy"]
