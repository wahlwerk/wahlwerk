[project]
name = "wahlwerk-calc"
version = "0.1.0"
description = "The formulas of electoral systems: plain numbers or numpy arrays in, plain numbers or arrays out"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wahlwerk_calc"]

[tool.ruff.lint.isort]
known-first-party = ["wahlwerk_calc"]
known-local-folder = ["reference"]
